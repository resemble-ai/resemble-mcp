name: Copilot plugin checks
on:
  pull_request:
    paths:
      - 'cowork_server.py'
      - 'server.py'
      - 'Dockerfile'
      - 'requirements*.txt'
      - 'copilot/**'
      - 'tests/**'
      - '.github/workflows/copilot-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests -q
      - run: python copilot/build.py --draft
      - uses: actions/upload-artifact@v4
        with:
          name: resemble-cowork-offline-review-only
          path: copilot/dist/resemble-cowork-DRAFT.zip
